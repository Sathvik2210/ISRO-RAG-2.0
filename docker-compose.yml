services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sathvik2210/isro-rag-backend:latest
    container_name: rag-backend

    expose:
      - "8000"

    env_file:
      - .env

    volumes:
      - ./vector_store:/app/vector_store
      - hf_cache:/root/.cache/huggingface

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image:  ghcr.io/sathvik2210/isro-rag-frontend:latest
    container_name: rag-frontend

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  hf_cache:

